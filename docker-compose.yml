services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  chatbot:
    build:
      context: .
      dockerfile: frontend/chatbot-interface/Dockerfile
    env_file:
      - ./frontend/chatbot-interface/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
    restart: unless-stopped
    command: >
      sh -c "pnpm install && pnpm dev --host 0.0.0.0 --port 3000"